<title id="t">Indoor corridor on a floor under fit-out</title>
<desc id="d">Looking down an indoor corridor. Rubble and offcuts lie along the floor, power cables cross the walkway, bare steel bars stick up near one wall, stacked boxes stand in front of a door at the far end and a worker carries long pipes towards the cables.</desc>
