<title id="t">Trench works — inspection scene</title>
<desc id="d">Cross-section of a trench about 2.5 m deep with vertical walls. A worker is at the bottom, an excavator holds a pipe on a chain over the trench, spoil is heaped along one edge, a worker walks along the other edge, and a cable runs from a DB across wet ground to a pump in the trench.</desc>
