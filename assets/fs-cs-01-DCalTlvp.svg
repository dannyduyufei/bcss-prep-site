<title id="t">Tank coating — confined space scene</title>
<desc id="d">Cut-away of an underground tank entered through a small opening. Inside, a worker lies on the floor; tins of solvent coating stand at the far side and vapour lines fill the tank; a second worker is climbing down the ladder; a running generator stands beside the opening with exhaust drifting toward it.</desc>
