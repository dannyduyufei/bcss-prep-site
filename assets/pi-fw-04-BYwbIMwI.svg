<title id="t">Column formwork panel on a crane hook</title>
<desc id="d">A tall column formwork panel hangs from a crane hook on a single sling leg and is tilted. A worker under the panel steadies it by hand, another worker stands on top of an erected column form, and steel starter bars stick up from the slab.</desc>
