<title id="t">Flat roof with a gin wheel hoist</title>
<desc id="d">A low building with a flat roof. A worker at the roof edge hauls a bucket up with a rope over a gin wheel; bricks are stacked on the roof edge beside the arm, and two workers walk on the ground beneath the bucket.</desc>
