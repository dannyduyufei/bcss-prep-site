<title id="t">Lorry crane lifting — scene</title>
<desc id="d">A lorry crane with outriggers set lifts a bundle of long steel bars toward a Level 2 slab. The bundle hangs from one sling near one end and is tilted, some bars are sliding out, and two workers walk on the ground beneath the load.</desc>
