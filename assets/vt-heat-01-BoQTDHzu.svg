<title id="title">Outdoor rebar work in the afternoon sun</title>
<desc id="desc">A hot, sunny worksite. On the right three workers tie and carry rebar on an open slab with no shelter. A display board beside them reads WBGT 33. On the far left is a small site office with a water dispenser, and a direction sign reads Water: 200 m. No drinking water, ice box or cooling supplies are shown near the crew.</desc>
