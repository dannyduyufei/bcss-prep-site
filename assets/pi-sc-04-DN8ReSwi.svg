<title id="t">Upper floor slab with two openings</title>
<desc id="d">An upper floor slab under construction. Near the front a square opening is partly covered by a plywood board sitting askew; at the back wall is a lift shaft doorway. One worker carries a large board in front of him and another bends at the shaft doorway.</desc>
