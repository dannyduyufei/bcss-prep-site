<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Lorry crane lifting a pallet, rear view</title>
<desc id="desc">Rear view of a lorry crane lifting a pallet of bricks out to the right. The left outrigger beam is extended and its jack rests on a timber pad. On the right, the side the load is on, the outrigger beam is pulled out only a short way and its jack foot hangs above soft, muddy ground. A worker stands on the left beside the extended outrigger.</desc>
