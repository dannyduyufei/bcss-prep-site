<title id="title">Welding on a steel beam</title>
<desc id="desc">A welder wearing a dark face shield crouches on a steel beam and welds a bracket. A stream of orange sparks falls straight down onto cardboard boxes, timber offcuts and a red tin marked Solvent on the floor below. Another worker walks past on the left. No fire extinguisher or other person watching is shown.</desc>
