<title id="title">Worker climbing into a manhole</title>
<desc id="desc">Cut-away view of a road and the ground below it. A manhole shaft goes down into darkness. A worker is already climbing down the rungs inside the shaft, with his head just below road level. The heavy cover lies on the road beside the opening and a tool bag sits nearby. Nobody else is at the opening.</desc>
