<title id="title">Scaffold access point with an inspection tag</title>
<desc id="desc">A metal scaffold with guard-rails and toe-boards stands against a building facade. At the foot of the access ladder a green tag board reads SCAFFOLD TAG, Safe for use, Inspected: 24 Sep 2026, Scaffold supervisor: signed. A board at top left reads Today: 7 Oct 2026. One worker is reaching for the ladder to climb and a second worker carrying a tool box walks towards it.</desc>
