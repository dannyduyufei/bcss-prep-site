<title id="title">Indoor corridor during fit-out works</title>
<desc id="desc">An indoor corridor. Timber offcuts with protruding nails, loose debris and a puddle of water lie across the floor. A cable runs from a distribution board on the left wall across the walkway. A red fire extinguisher on the wall is hidden behind stacked cartons, and several boards lean against the exit door on the right. A worker carrying long boards walks through the corridor.</desc>
