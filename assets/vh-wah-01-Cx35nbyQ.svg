<title id="title">Open slab edge on an upper floor</title>
<desc id="desc">Side view of a building frame under construction. On Level 5 a worker carries a tall plywood sheet towards the right-hand end of the slab. The yellow edge rail on Level 5 runs only part of the way along the slab and a loose rail section lies flat on the floor; Level 4 below has a rail along its whole edge.</desc>
