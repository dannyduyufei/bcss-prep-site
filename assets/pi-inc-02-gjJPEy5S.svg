<title id="t">Collapsed bay of slab formwork after a crane landed a load</title>
<desc id="d">One bay of slab formwork has sagged into a V shape. Props underneath are bent, a bundle of steel bars lies on the sagging deck, an empty crane hook hangs above, and a worker sits on the floor below holding his leg next to fallen timber.</desc>
