<title id="title">Lorry parked on a ramp during unloading</title>
<desc id="desc">A green flatbed lorry is parked facing uphill on a sloping ramp. The cab door is open and the driver, in a white helmet, is walking away uphill while using a phone. Two yellow wheel chocks lie flat on the ground near the cab instead of against the wheels. Downhill, directly behind the lorry, two workers are unloading and stacking bricks.</desc>
