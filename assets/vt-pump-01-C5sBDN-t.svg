<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Concrete pump truck set up beside an open trench</title>
<desc id="desc">Side view of a yellow concrete pump truck with its boom raised and reaching over to a building slab on the right, where a worker holds the hose end. The front outrigger is extended onto a timber pad. The rear outrigger is short of full extension and its foot rests on bare, soft, cracked ground right at the edge of an open trench, with no pad under it.</desc>
