<title id="title">Worker crossing a roof</title>
<desc id="desc">A low-sloped metal roof seen from above at an angle. A pale translucent panel is set into the roof surface and has a crack line across it. A worker carrying a roofing sheet is stepping onto that panel. There are no boards, rails or nets visible on the roof.</desc>
