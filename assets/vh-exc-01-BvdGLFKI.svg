<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Pipe-laying trench, cross-section</title>
<desc id="desc">Cross-section of a narrow trench about 2.5 m deep with straight earth walls. A worker bends over a pipe at the bottom. A large heap of dug-out soil sits right on the right-hand edge, where cracks show in the trench wall. No boards, struts, rails or ladder are visible. An excavator is parked further right.</desc>
