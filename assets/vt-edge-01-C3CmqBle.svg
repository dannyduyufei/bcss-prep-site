<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Materials stacked at an upper-floor slab edge</title>
<desc id="desc">Side view of a building frame. On Level 6 the slab edge has yellow posts with a top rail and a mid rail but no board along the floor; bricks are stacked right against the edge and a hammer and loose bolts lie beside them, while a worker carries more bricks towards the edge. Level 5 below has a full rail with a board at floor level. On the ground directly beneath the edge, two workers walk along a walkway.</desc>
