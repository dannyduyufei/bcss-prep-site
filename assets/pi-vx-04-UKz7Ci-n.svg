<title id="t">Concrete pump truck and a parked lorry on a sloping site road</title>
<desc id="d">A concrete pump truck with its boom raised stands with a stabiliser leg pressing into soft ground, and a worker reaches up under the hose end. Down the sloping road a lorry is parked with its door open and the cab empty; a worker stands on the downhill side in front of it.</desc>
