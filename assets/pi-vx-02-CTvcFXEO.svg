<title id="t">Lorry crane lifting a bundle of steel bars</title>
<desc id="d">A lorry crane lifts a bundle of steel bars. The left stabiliser is fully out on a timber mat; the right one is only partly out and rests on soft ground beside an open trench. A worker stands under the hanging bundle steadying it by hand.</desc>
