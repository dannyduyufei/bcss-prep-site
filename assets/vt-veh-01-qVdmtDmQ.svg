<title id="title">Tipper lorry reversing in a loading area</title>
<desc id="desc">Side view of an orange tipper lorry with its cab on the right. A red arrow and the word Reversing show it backing towards the left, its rear lights lit. Directly behind the lorry a worker walks across its path looking down at a mobile phone. A second worker stands further left beside a stack of pallets. No one is standing at the side guiding the driver.</desc>
