<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Site gate and shared access road, plan view</title>
<desc id="desc">Plan view looking down on a site access road running up from the site gate. A green painted walkway runs along the left side of the road, but a stack of timber and other materials sits on the walkway part of the way along. A concrete mixer truck is driving in through the gate. Three workers are walking on the road surface itself, close to the truck, beside the stacked materials.</desc>
