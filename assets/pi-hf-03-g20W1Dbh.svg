<title id="t">Temporary power board and leads on a wet floor</title>
<desc id="d">A temporary distribution board on a wall with its door open. Cables run down into a pool of water on the floor, one cable has a taped joint lying in the water, a multi-way adaptor has several plugs stacked into it and a worker in the water plugs in a tool.</desc>
