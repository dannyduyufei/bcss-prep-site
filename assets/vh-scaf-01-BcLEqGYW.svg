<title id="title">Facade scaffold with two working lifts</title>
<desc id="desc">Front view of a three-bay metal scaffold against a wall. The lower platform has a top rail, a middle rail and an orange board along its edge. The upper platform has only a single top rail, with loose bricks and a hammer lying near its edge; one worker there leans out over the rail. Another worker walks on the ground under the scaffold. A tag holder on the first upright is empty.</desc>
