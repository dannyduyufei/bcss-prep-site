<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">Slab formwork on props during a concrete pour</title>
<desc id="desc">Side section of a slab formwork deck being filled with wet concrete from a pump hose; two workers stand on the deck. Under the left half, steel props stand on base plates on a timber sole board and are cross-braced. Under the right half the props have no bracing and no base plates: one prop leans and sinks into a muddy patch, another stands on a loose stack of bricks. A worker is bending down underneath the right half.</desc>
