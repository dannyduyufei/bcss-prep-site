<title id="t">Roof torch-on — hot work scene</title>
<desc id="d">A flat roof where a worker uses a gas torch to lay waterproofing membrane. A gas cylinder lies on its side with its hose crossing the work area, a small fire has started at a pile of rolls and packaging by the parapet, and a second worker kneels near the open roof edge.</desc>
